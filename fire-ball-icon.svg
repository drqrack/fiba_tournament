<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 8 200 230" role="img" aria-label="Flaming basketball logo">
<defs>
  <radialGradient id="fbBall" cx="38%" cy="32%" r="75%">
    <stop offset="0%" stop-color="#FFB070"/><stop offset="55%" stop-color="#E8742A"/><stop offset="100%" stop-color="#8E3A0C"/>
  </radialGradient>
  <radialGradient id="fbGlow" cx="50%" cy="55%" r="50%">
    <stop offset="0%" stop-color="#FF8A00" stop-opacity=".75"/><stop offset="60%" stop-color="#CE1126" stop-opacity=".25"/><stop offset="100%" stop-color="#CE1126" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="fbHeat" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFD23F" stop-opacity=".85"/><stop offset=".45" stop-color="#FF6A00" stop-opacity=".25"/><stop offset=".7" stop-color="#FF6A00" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="fbRed" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#8E0B1A"/><stop offset="1" stop-color="#E0182F"/></linearGradient>
  <linearGradient id="fbOrange" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#FF5A00"/><stop offset="1" stop-color="#FF9A1F"/></linearGradient>
  <linearGradient id="fbGold" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#FFB000"/><stop offset="1" stop-color="#FCD116"/></linearGradient>
  <clipPath id="fbClip"><circle cx="100" cy="155" r="52"/></clipPath>
  <filter id="fbWave" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.045" numOctaves="1" seed="3" result="n">
      <animate attributeName="baseFrequency" dur="1.6s" values="0.012 0.045;0.016 0.06;0.011 0.04;0.012 0.045" repeatCount="indefinite"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs>
<style>
  .fb-glow{transform-origin:100px 150px;animation:fbPulse 1.4s ease-in-out infinite}
  .fb-f{transform-origin:100px 165px;animation:fbFlick var(--d,.7s) ease-in-out infinite alternate}
  .fb-f1{--d:.9s}.fb-f2{--d:.65s;animation-delay:-.2s}.fb-f3{--d:.5s;animation-delay:-.35s}.fb-f4{--d:.38s}
  .fb-lick{transform-box:fill-box;transform-origin:50% 100%;animation:fbLick var(--d,.45s) ease-in-out infinite alternate}
  .fb-seams{transform-origin:100px 155px;animation:fbSpin 9s linear infinite}
  .fb-heat{animation:fbHeat 1.1s ease-in-out infinite alternate}
  .fb-ember{animation:fbEmber var(--d,2.4s) linear infinite;animation-delay:var(--dl,0s);opacity:0}
  @keyframes fbPulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.07);opacity:1}}
  @keyframes fbFlick{0%{transform:scale(1,1) skewX(0)}35%{transform:scale(.97,1.05) skewX(-3deg)}70%{transform:scale(1.02,.96) skewX(2deg)}100%{transform:scale(.98,1.08) skewX(-1deg)}}
  @keyframes fbLick{0%{transform:scaleY(.75) skewX(4deg)}100%{transform:scaleY(1.15) skewX(-5deg)}}
  @keyframes fbSpin{to{transform:rotate(360deg)}}
  @keyframes fbHeat{from{opacity:.55}to{opacity:1}}
  @keyframes fbEmber{0%{transform:translate(0,0) scale(1);opacity:0}10%{opacity:1}100%{transform:translate(var(--x,0px),-120px) scale(.2);opacity:0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<circle class="fb-glow" cx="100" cy="150" r="82" fill="url(#fbGlow)"/>

<g filter="url(#fbWave)">
  <path class="fb-f fb-f1" fill="url(#fbRed)" d="M45 160 C35 120 50 95 62 80 C60 100 70 105 75 100 C70 75 80 45 100 18 C98 50 112 65 120 70 C122 55 130 45 141 36 C135 60 150 80 148 100 C155 92 158 85 160 76 C171 100 168 135 155 160 Z"/>
  <path class="fb-f fb-f2" fill="url(#fbOrange)" d="M56 160 C48 130 58 110 69 96 C69 112 78 116 84 111 C80 88 90 62 104 40 C104 68 116 80 123 86 C126 74 132 66 139 60 C136 80 147 98 145 115 C151 108 153 100 155 94 C162 118 157 140 147 160 Z"/>
  <path class="fb-f fb-f3" fill="url(#fbGold)" d="M70 160 C64 140 70 124 79 114 C79 125 86 128 90 124 C88 106 96 88 106 72 C106 94 116 104 121 108 C124 100 128 96 133 91 C133 108 141 124 137 140 C135 150 132 156 128 160 Z"/>
  <path class="fb-f fb-f4" fill="#FFF1B3" d="M86 160 C82 148 88 137 94 130 C96 140 100 139 102 134 C102 121 108 111 112 103 C114 118 122 129 120 145 C119 152 116 157 114 160 Z"/>
</g>

<!-- ball -->
<circle cx="100" cy="155" r="52" fill="url(#fbBall)" stroke="#1b1b1b" stroke-width="3.5"/>
<g clip-path="url(#fbClip)">
  <g class="fb-seams" fill="none" stroke="#1b1b1b" stroke-width="3.2" stroke-linecap="round">
    <line x1="100" y1="100" x2="100" y2="210"/>
    <line x1="45" y1="155" x2="155" y2="155"/>
    <path d="M66 115 Q90 155 66 195"/>
    <path d="M134 115 Q110 155 134 195"/>
  </g>
  <rect class="fb-heat" x="45" y="100" width="110" height="110" fill="url(#fbHeat)"/>
</g>
<circle cx="100" cy="155" r="52" fill="none" stroke="#1b1b1b" stroke-width="3.5"/>
<ellipse cx="82" cy="132" rx="14" ry="8" fill="#fff" opacity=".18" transform="rotate(-30 82 132)"/>

<!-- flame licks wrapping over the top of the ball -->
<g filter="url(#fbWave)">
  <path class="fb-lick" style="--d:.42s" fill="url(#fbOrange)" d="M60 128 C58 118 62 108 68 100 C68 110 74 114 78 112 C80 120 76 128 72 132 Z"/>
  <path class="fb-lick" style="--d:.55s" fill="url(#fbGold)"   d="M84 112 C82 100 88 88 96 80 C96 92 102 96 106 92 C110 102 106 110 100 114 Z"/>
  <path class="fb-lick" style="--d:.47s" fill="url(#fbOrange)" d="M118 112 C118 102 124 94 130 88 C130 98 136 102 138 100 C142 110 138 120 132 124 Z"/>
  <path class="fb-lick" style="--d:.36s" fill="#FFE27A"        d="M92 108 C92 100 96 94 100 90 C101 98 104 100 106 98 C108 104 104 108 100 110 Z"/>
</g>

<!-- embers -->
<g fill="#FFC23A">
  <circle class="fb-ember" cx="70"  cy="110" r="2.2" style="--d:2.2s;--dl:0s;--x:-14px"/>
  <circle class="fb-ember" cx="95"  cy="80"  r="1.8" style="--d:2.6s;--dl:.6s;--x:8px"/>
  <circle class="fb-ember" cx="125" cy="90"  r="2.4" style="--d:2.0s;--dl:1.1s;--x:16px"/>
  <circle class="fb-ember" cx="110" cy="70"  r="1.6" style="--d:2.8s;--dl:1.6s;--x:-6px"/>
  <circle class="fb-ember" cx="140" cy="110" r="2"   style="--d:2.3s;--dl:.3s;--x:22px"/>
  <circle class="fb-ember" cx="58"  cy="130" r="1.6" style="--d:2.5s;--dl:1.3s;--x:-20px"/>
</g>
</svg>
